name: Deploy static guide to GitHub Pages
on:
  push:
    branches: [main, master]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: github-pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5
      - name: Test
        run: |
          node --test tests/*.test.cjs
          node --check app.js
      - name: Generate static pages and SEO
        env:
          SITE_URL: ${{ steps.pages.outputs.base_url }}/
        run: node scripts/build-seo.cjs
      - name: Stage public files
        run: |
          mkdir _site
          cp index.html items.html catalog.html about.html styles.css app.js guide-data.js robots.txt sitemap.xml llms.txt _site/
          cp -R item Data _site/
          touch _site/.nojekyll
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
